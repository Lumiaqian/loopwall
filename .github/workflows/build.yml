# Tests, lints and packages Loopwall on every push and pull request; a tag
# vX.Y.Z also publishes the package as a GitHub release. When MACOS_CERTIFICATE
# and MACOS_SIGNING_IDENTITY secrets are configured, the app and extension are
# signed with that fixed certificate and verified against designated requirement;
# otherwise builds fall back to ad-hoc signing (no Developer ID / notarization).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 27 with Xcode 27: the SDK and Swift the extension and the
    # native module are built with, and Icon Composer's ictool for the icon.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The same versions as local development, from the official releases and
      # verified by checksum, so a new release cannot change the lint result.
      - name: Tools
        env:
          SWIFTFORMAT_VERSION: 0.64.6
          SWIFTFORMAT_SHA256: 70e6b2057647fb1c54d620ebbb6649274de56534c57f91f67461a129ebaaba3e
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          xcodebuild -version
          go version
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools/dl"
          curl -fsSL -o "$tools/dl/swiftformat.zip" "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$tools/dl/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTFORMAT_SHA256  $tools/dl/swiftformat.zip" | shasum -a 256 -c -
          echo "$SWIFTLINT_SHA256  $tools/dl/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$tools/dl/swiftformat.zip" swiftformat -d "$tools"
          unzip -q "$tools/dl/swiftlint.zip" swiftlint -d "$tools"
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/swiftformat" --version
          "$tools/swiftlint" --version

      - name: Native bridge is up to date
        run: |
          go tool mygo native check internal/platform
          git diff --exit-code -- internal/platform

      - name: Test
        run: scripts/test.sh

      - name: Lint
        run: |
          git ls-files -z -- '*.go' | xargs -0 gofmt -l > "$RUNNER_TEMP/gofmt-files"
          cat "$RUNNER_TEMP/gofmt-files"
          test ! -s "$RUNNER_TEMP/gofmt-files"
          swiftformat --lint .
          swiftlint lint --quiet LoopwallExtension internal/platform/swift/Sources/Platform tests

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Configure optional signing certificate
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "signed_cert=false" >> "$GITHUB_OUTPUT"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; building ad-hoc signed package."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "signed_cert=true" >> "$GITHUB_OUTPUT"
          echo "identity=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/build-local.sh

      - name: Check host privacy descriptions
        run: |
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path

          path = Path("dist/darwin-arm64/Loopwall.app/Contents/Info.plist")
          with path.open("rb") as file:
              info = plistlib.load(file)
          for key in ("NSBluetoothAlwaysUsageDescription", "NSLocalNetworkUsageDescription"):
              value = info.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"{path}: missing or empty {key}")
          PYTHON

      - name: Package
        id: package
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mygo.json version $version"
            exit 1
          fi
          extension=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/darwin-arm64/Loopwall.app/Contents/Extensions/LoopwallExtension.appex/Contents/Info.plist")
          if [[ "$extension" != "$version" ]]; then
            echo "::error::the extension's MARKETING_VERSION $extension does not match mygo.json version $version"
            exit 1
          fi
          name="Loopwall-$version-arm64.zip"
          ditto -c -k --keepParent "dist/darwin-arm64/Loopwall.app" "$name"
          shasum -a 256 "$name" | tee "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Only a release signs: the key is in the repository's secrets, which
      # pull requests and pushes never see. The update is the bundle as
      # shipped, the extension in it, which mygo build's own would lack.
      - name: Sign the update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          SIGNED_CERT: ${{ steps.signing.outputs.signed_cert }}
        run: |
          go run ./cmd/updatepack -app dist/darwin-arm64/Loopwall.app -out .
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          python3 - "$version" "${SIGNED_CERT:-false}" > release-notes.md <<'PY'
          import sys
          version, signed_cert = sys.argv[1], sys.argv[2] == "true"
          out, inside = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line[3:].strip().strip("[]").split()[0].strip("[]") == version
                  continue
              if inside:
                  out.append(line.rstrip())
          print("\n".join(out).strip())
          print()
          print("---")
          print()
          if signed_cert:
              print("Apple Silicon、macOS 26 及以上。已安装 0.1.2 及以后版本的会自动提示更新。本构建使用固定自签名证书签名（更新可保留系统权限识别），未经 Apple 公证；首次安装如被拦截，到「系统设置 → 隐私与安全性」点「仍要打开」，或运行 `xattr -dr com.apple.quarantine /Applications/Loopwall.app`。然后在系统墙纸设置里选择「Loopwall 轮播」。")
          else:
              print("Apple Silicon、macOS 26 及以上。已安装 0.1.2 及以后版本的会自动提示更新。首次安装：解压后把 Loopwall.app 放进「应用程序」；本构建为 ad-hoc 签名、未经公证，首次打开若被拦截，到「系统设置 → 隐私与安全性」点「仍要打开」，或运行 `xattr -dr com.apple.quarantine /Applications/Loopwall.app`。然后在系统墙纸设置里选择「Loopwall 轮播」。")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Loopwall-arm64
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
            loopwall-*.tar.gz
            update-darwin-arm64.json
            release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Extension build log
        if: failure()
        run: tail -n 200 build/extension-build.log || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Loopwall-arm64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The updates' manifest goes with the release, the latest, which
          # installed apps read update-darwin-arm64.json from.
          gh release create "$GITHUB_REF_NAME" Loopwall-*.zip Loopwall-*.zip.sha256 \
            loopwall-*.tar.gz update-darwin-arm64.json \
            --repo "$GITHUB_REPOSITORY" --title "Loopwall ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
